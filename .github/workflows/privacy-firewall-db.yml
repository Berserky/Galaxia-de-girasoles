name: Privacy Firewall DB

on:
  pull_request:
    branches: [desarrollo, qa, prod]
    paths:
      - 'supabase/**'
      - 'tests/privacy-firewall-db.sql'
      - 'tests/phase4-member-location-rls.sql'
      - 'tests/privacy-firewall-pre-migration.sql'
      - 'tests/privacy-firewall-chat-e2e.sh'
      - 'tests/privacy-firewall.test.mjs'
      - 'tests/supabase-rls.sql'
      - 'tests/phase4-invitation-identity.sql'
      - '.github/workflows/privacy-firewall-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-firewall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Initialize isolated pre-Phase-0 database
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          mv supabase/migrations/20261004232942_qa_phase0_privacy_firewall.sql /tmp/phase0.sql
          mv supabase/migrations/20261005011401_qa_phase1_data_integrity.sql /tmp/phase1.sql
          mv supabase/migrations/20261005023031_qa_phase2_chat_correctness.sql /tmp/phase2.sql
          mv supabase/migrations/20261008193000_ng_phase4_member_location_rls.sql /tmp/phase4.sql
          supabase start

      - name: Seed pre-Phase-0 orphan
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/privacy-firewall-pre-migration.sql

      - name: Apply Phase 0 through migration history
        run: |
          mv /tmp/phase0.sql supabase/migrations/20261004232942_qa_phase0_privacy_firewall.sql
          supabase migration up

      - name: Run RLS regression
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/supabase-rls.sql

      - name: NG-FNC invitation expiry, replacement, reuse and profile isolation
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/phase4-invitation-identity.sql

      - name: Run Phase 0 two-profile attack probes
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/privacy-firewall-db.sql



      - name: Validate Phase 0 rollback and re-apply
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261004232942_qa_phase0_privacy_firewall_rollback.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/migrations/20261004232942_qa_phase0_privacy_firewall.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/privacy-firewall-db.sql

      - name: Apply current backend prerequisites for Edge privacy E2E
        run: |
          mv /tmp/phase1.sql supabase/migrations/20261005011401_qa_phase1_data_integrity.sql
          supabase migration up
          mv /tmp/phase2.sql supabase/migrations/20261005023031_qa_phase2_chat_correctness.sql
          supabase migration up
          mv /tmp/phase4.sql supabase/migrations/20261008193000_ng_phase4_member_location_rls.sql
          supabase migration up

      - name: NG-AUD-004 Verify authenticated outsiders cannot read shared GPS
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/phase4-member-location-rls.sql

      - name: Run delete-for-both and privacy Edge E2E
        run: bash tests/privacy-firewall-chat-e2e.sh

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
