name: Galaxy Chat 4 Phase 5 Camera Media

on:
  pull_request:
    branches: [desarrollo, qa, prod]
    paths:
      - "android/**"
      - "supabase/functions/android-companion/**"
      - "tests/chat-4-phase5-media-camera.test.mjs"
      - "scripts/qa_camerax_report.py"
      - "scripts/qa-camerax-emulator.sh"
      - "tests/test_qa_camerax_results.py"
      - "docs/qa/chat-4-phase5-media-camera.md"
      - ".github/workflows/chat-4-phase5-media-camera.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat4-phase5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Media contracts + Deno validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Syntax and Phase 5 contracts
        run: |
          node --check android/app/src/main/assets/mobile/app.js
          node --test tests/chat-4-phase5-media-camera.test.mjs
          deno check --node-modules-dir=auto supabase/functions/android-companion/index.ts
          deno test supabase/functions/android-companion/media-validation.test.ts
      - name: Validate strict CameraX coverage gate
        run: python3 -m unittest discover -s tests -p test_qa_camerax_results.py
      - name: Full Node regression
        run: npm test

  android:
    name: CameraX unit lint build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Package welcome music
        run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - name: Unit lint debug build
        run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug

  camera_emulator:
    name: CameraX emulator photo video review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Package welcome music
        run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - name: Camera/media instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/qa-camerax-emulator.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: galaxy-chat-4-phase5-camera-emulator
          path: qa-artifacts/**
          retention-days: 14
