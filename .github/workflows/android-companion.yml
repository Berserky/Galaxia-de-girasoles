name: Android companion

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "supabase/functions/android-companion/**"
      - ".github/workflows/android-companion.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "supabase/functions/android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: QA y APK
        run: gradle -p android testDebugUnitTest assembleDebug
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NuestraGalaxia-Companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NuestraGalaxia-Companion
          path: NuestraGalaxia-Companion.apk
          retention-days: 7
      - name: Publicar APK estable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v1.0.0 >/dev/null 2>&1 || gh release create android-v1.0.0 --title "Nuestra Galaxia · Compañero Android" --notes "APK privado para ubicación persistente autorizada. Android muestra una notificación permanente mientras comparte."
          gh release upload android-v1.0.0 NuestraGalaxia-Companion.apk --clobber
