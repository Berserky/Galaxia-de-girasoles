name: Nuestra Galaxia Android
# Release metadata is derived from android/app/build.gradle.kts.
on:
  pull_request:
    branches: [main]
    paths: ["app/public/**","app/cloud/**","scripts/build-pages.mjs","android/**","supabase/functions/android-companion/**","supabase/migrations/**",".github/workflows/android-companion.yml"]
  push:
    branches: [main]
    paths: ["android/**","scripts/qa-android-mobile.mjs","supabase/functions/android-companion/**","supabase/migrations/**",".github/workflows/android-companion.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID || vars.FIREBASE_APPLICATION_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID || vars.FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Preparar Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.4.1" }
      - name: Estado configuración Firebase
        run: |
          if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_APPLICATION_ID" ] && [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_SENDER_ID" ]; then
            echo "Firebase client configurado desde GitHub."
          else
            echo "Firebase client se completará en runtime desde el backend seguro."
          fi
      - name: Empaquetar música de bienvenida
        run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - name: QA interfaz móvil
        run: |
          node --check android/app/src/main/assets/mobile/app.js
          node --check android/app/src/main/assets/mobile/map.js
          node scripts/qa-android-mobile.mjs
      - name: QA Android
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug
      - name: Reporte Android Lint
        if: always()
        run: |
          REPORT=$(find android/app/build -name 'lint-results-debug.txt' -type f | head -1)
          if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "Sin reporte de Lint disponible"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: NuestraGalaxia-debug, path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 7 }

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID || vars.FIREBASE_APPLICATION_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID || vars.FIREBASE_SENDER_ID }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Preparar Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.4.1" }
      - name: Empaquetar música de bienvenida
        run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - name: Compilar estable firmado
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          gradle -p android assembleRelease -Pandroid.injected.signing.store.file="$PWD/android/release.keystore" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp android/app/build/outputs/apk/release/app-release.apk NuestraGalaxia.apk
          SHA=$(sha256sum NuestraGalaxia.apk | awk '{print $1}')
          VERSION_LINE=$(grep -oE 'versionCode = [0-9]+; versionName = "[^"]+"' android/app/build.gradle.kts | head -1)
          VERSION_CODE=$(printf '%s' "$VERSION_LINE" | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          VERSION_NAME=$(printf '%s' "$VERSION_LINE" | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://github.com/Berserky/Galaxia-de-girasoles/releases/download/android-stable/NuestraGalaxia.apk","sha256":"%s","notes":"Nuestra Galaxia %s · revisión integral de seguridad, calidad y rendimiento."}\n' "$VERSION_CODE" "$VERSION_NAME" "$SHA" "$VERSION_NAME" > update.json
      - name: Publicar canal estable
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-stable >/dev/null 2>&1 || gh release create android-stable --title "Nuestra Galaxia · Android estable" --notes "Canal estable para actualizaciones internas."
          gh release upload android-stable NuestraGalaxia.apk update.json --clobber
          gh release delete-asset android-stable NuestraGalaxia-Companion.apk -y >/dev/null 2>&1 || true
