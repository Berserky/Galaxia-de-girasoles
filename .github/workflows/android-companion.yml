name: Nuestra Galaxia Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/public/**"
      - "app/cloud/**"
      - "scripts/build-pages.mjs"
      - "scripts/qa-android-mobile.mjs"
      - "android/**"
      - "supabase/functions/android-companion/**"
      - "supabase/migrations/**"
      - "tests/**"
      - ".github/workflows/android-companion.yml"
      - ".github/workflows/android-release-candidate.yml"
      - ".github/workflows/android-release-stable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android unit + lint + release build
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID || vars.FIREBASE_APPLICATION_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID || vars.FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Deno type checks and Edge tests
        run: |
          deno check --node-modules-dir=auto supabase/functions/android-companion/index.ts
          deno test supabase/functions/android-companion/media-validation.test.ts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Estado configuración Firebase
        run: |
          if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_APPLICATION_ID" ] && [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_SENDER_ID" ]; then
            echo "Firebase client configurado desde GitHub."
          else
            echo "Firebase client se completará en runtime desde el backend seguro."
          fi
      - name: Empaquetar música de bienvenida
        run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - name: QA interfaz móvil
        run: |
          node --check android/app/src/main/assets/mobile/app.js
          node --check android/app/src/main/assets/mobile/map.js
          node --test tests/android-chat-premium.test.mjs tests/multimedia-android-phase3.test.mjs tests/release-governance.test.mjs
          node scripts/qa-android-mobile.mjs
      - name: Android unit, lint y release no firmado
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Reporte Android Lint
        if: always()
        run: |
          REPORT=$(find android/app/build -name 'lint-results-debug.txt' -type f | head -1)
          if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "Sin reporte de Lint disponible"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NuestraGalaxia-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: NuestraGalaxia-release-ci
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
