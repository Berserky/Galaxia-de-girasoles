name: Android companion
on:
  pull_request:
    branches: [main]
    paths: ["app/public/**","app/cloud/**","scripts/build-pages.mjs","android/**","supabase/functions/android-companion/**",".github/workflows/android-companion.yml"]
  push:
    branches: [main]
    paths: ["android/**","supabase/functions/android-companion/**",".github/workflows/android-companion.yml"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Preparar Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.4.1" }
      - name: QA
        run: gradle -p android testDebugUnitTest assembleDebug
      - name: Compilar estable firmado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          gradle -p android assembleRelease -Pandroid.injected.signing.store.file="$PWD/android/release.keystore" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp android/app/build/outputs/apk/release/app-release.apk NuestraGalaxia-Companion.apk
          SHA=$(sha256sum NuestraGalaxia-Companion.apk | awk '{print $1}')
          printf '{"versionCode":4,"versionName":"1.3.0","apkUrl":"https://github.com/Berserky/Galaxia-de-girasoles/releases/download/android-stable/NuestraGalaxia-Companion.apk","sha256":"%s","notes":"Momentos para dos: widget con foto y próxima fecha, abrazos y notificaciones periódicas opcionales."}\n' "$SHA" > update.json
      - name: Publicar canal estable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-stable >/dev/null 2>&1 || gh release create android-stable --title "Nuestra Galaxia · Android estable" --notes "Canal estable para actualizaciones internas."
          gh release upload android-stable NuestraGalaxia-Companion.apk update.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: NuestraGalaxia-Companion-debug, path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 7 }
