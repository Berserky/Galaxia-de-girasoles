name: Galaxy Chat 4 Phase 8 Motion
on:
  pull_request:
    branches: [main]
    paths: ['android/**', 'tests/**', 'scripts/qa-android-mobile.mjs', '.github/workflows/chat-4-phase8-motion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase8-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/qa-android-mobile.mjs
      - run: node --check android/app/src/main/assets/mobile/chat-motion.js
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle -p android --no-daemon connectedDebugAndroidTest -PQA_EDGE_URL=http://127.0.0.1:18765 -PQA_SUPABASE_PUBLISHABLE_KEY=qa_phase8 -PQA_APPLICATION_SUFFIX=.phase8qa -Pandroid.testInstrumentationRunnerArguments.class=com.nuestragalaxia.companion.GalaxyDeviceClosureTest#chatPhase8Motion_realWebViewEventsReducedMotionAnd20k,com.nuestragalaxia.companion.GalaxyDeviceClosureTest#chatMotionBenchmark20k_device
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase8-motion-webview
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
