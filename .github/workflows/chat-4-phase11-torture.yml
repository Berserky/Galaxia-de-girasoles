name: Galaxy Chat 4 Phase 11 Torture
on:
  pull_request:
    branches: [desarrollo, qa, prod]
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/qa/chat-4-phase11-*'
      - '.github/workflows/chat-4-phase11-torture.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-torture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: P0/P1 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/phase11-gate.mjs
      - run: node scripts/qa-android-mobile.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase11-report
          path: docs/qa/chat-4-phase11-*.json
          retention-days: 30

  android-stress:
    name: Android stress matrix
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Preserve strict SDK gate, retry truncated emulator ZIP downloads.
          sdk_ok=0
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "platform-tools"; then
              sdk_ok=1
              break
            fi
            echo "::warning::Android SDK package download failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          test "$sdk_ok" -eq 1
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cp musica.mp3 android/app/src/main/assets/musica.mp3
      - run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      # Run all 23 closure tests exactly once across two FRESH Android
      # emulators, avoiding cumulative graphics pressure after test ~16.
      # Keep native screenshots, focus, privacy and lifecycle assertions strict.
      - name: Torture instrumentation - fresh AVD shard 0/2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-build: 15261927
          disable-animations: true
          emulator-options: -no-window -gpu software -memory 1536 -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest -PQA_EDGE_URL=http://127.0.0.1:18765 -PQA_SUPABASE_PUBLISHABLE_KEY=qa_phase11 '-Pandroid.testInstrumentationRunnerArguments.phase10SoakMs=120000' '-Pandroid.testInstrumentationRunnerArguments.numShards=2' '-Pandroid.testInstrumentationRunnerArguments.shardIndex=0' '-Pandroid.testInstrumentationRunnerArguments.class=com.nuestragalaxia.companion.GalaxyDeviceClosureTest'
            mkdir -p qa-artifacts/phase11-shards/closure-0
            cp android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml qa-artifacts/phase11-shards/closure-0/
      - name: Torture instrumentation - fresh AVD shard 1/2 plus media
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-build: 15261927
          disable-animations: true
          emulator-options: -no-window -gpu software -memory 1536 -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest -PQA_EDGE_URL=http://127.0.0.1:18765 -PQA_SUPABASE_PUBLISHABLE_KEY=qa_phase11 '-Pandroid.testInstrumentationRunnerArguments.phase10SoakMs=120000' '-Pandroid.testInstrumentationRunnerArguments.numShards=2' '-Pandroid.testInstrumentationRunnerArguments.shardIndex=1' '-Pandroid.testInstrumentationRunnerArguments.class=com.nuestragalaxia.companion.GalaxyDeviceClosureTest'
            mkdir -p qa-artifacts/phase11-shards/closure-1
            cp android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml qa-artifacts/phase11-shards/closure-1/
            gradle -p android --no-daemon connectedDebugAndroidTest -PQA_EDGE_URL=http://127.0.0.1:18765 -PQA_SUPABASE_PUBLISHABLE_KEY=qa_phase11 '-Pandroid.testInstrumentationRunnerArguments.class=com.nuestragalaxia.companion.GalaxyMediaExperienceTest,com.nuestragalaxia.companion.GalaxyVoiceMessagesDeviceTest'
            mkdir -p qa-artifacts/phase11-shards/media
            cp android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml qa-artifacts/phase11-shards/media/
            node scripts/p8-verify-phase11-shards.mjs
      - name: Capturar diagnóstico de AVD si falla el gate
        if: failure()
        shell: bash
        run: bash scripts/p8-emulator-diagnostics.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase11-android-stress
          path: |
            qa-artifacts/p8-emulator-health.txt
            qa-artifacts/phase11-shards/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            android/app/build/reports/lint-results-debug.html
          retention-days: 30
