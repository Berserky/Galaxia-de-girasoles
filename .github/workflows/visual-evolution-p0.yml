name: V5 P0 baseline and synthetic visual preview

on:
  pull_request:
    branches: [desarrollo]
    paths:
      - "docs/visual-evolution-5/**"
      - "tests/visual-evolution-p0.test.mjs"
      - "tests/visual-evolution-p1.test.mjs"
      - "android/app/src/main/assets/mobile/**"
      - "scripts/visual-evolution-p0-avd.sh"
      - "scripts/visual-evolution-p1-avd.sh"
      - "scripts/visual-evolution-p0-baseline.mjs"
      - ".github/workflows/visual-evolution-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-contract:
    name: Node 24 full suite + V5 P0 measurements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Versiones y tests completos (incluye tema, acceso y regresiones)
        run: |
          node --version
          npm test
      - name: Registrar baseline de tamaño y rutas (no FPS)
        run: node scripts/visual-evolution-p0-baseline.mjs --out build/visual-evolution-p0-baseline.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-p0-static-source-baseline
          path: build/visual-evolution-p0-baseline.json
          if-no-files-found: warn
          retention-days: 30

  synthetic-design-captures:
    name: Chrome screenshots - DEMO sintética, NO APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fotografiar prototipo en siete temas y dos viewports
        shell: bash
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BROWSER" ]; then echo "BLOCKED: runner sin Chrome/Chromium"; exit 1; fi
          mkdir -p build/p0-previews
          for theme in daylight cosmic halloween christmas valentine friendship easter; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=393,852 --screenshot="$PWD/build/p0-previews/$theme-393.png" "file://$PWD/docs/visual-evolution-5/prototypes/celestial-shell.html?theme=$theme" >/dev/null 2>&1
          done
          for width in 320 412; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size="$width,852" --screenshot="$PWD/build/p0-previews/daylight-$width.png" "file://$PWD/docs/visual-evolution-5/prototypes/celestial-shell.html?theme=daylight" >/dev/null 2>&1
          done
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('build/p0-previews').glob('*.png'))
          assert len(files)==9, f'Expected 9 synthetic preview images, got {len(files)}'
          for p in files:
              assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), f'Invalid PNG: {p}'
          print('9 valid synthetic preview PNGs (NOT app screenshots).')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-p0-synthetic-design-screenshots
          path: build/p0-previews/*.png
          if-no-files-found: warn
          retention-days: 30

  android-qa-avd:
    name: AVD QA unpaired APK - starts + screenshots + raw gfxinfo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Preparar SDK Android y emulador
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # SDK mirror sometimes serves a transient corrupt ZIP; retry instead of failing before compilation.
          sdk_ok=0
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "platform-tools"; then
              sdk_ok=1
              break
            fi
            echo "::warning::Android SDK package download failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          test "$sdk_ok" -eq 1
          # Emulator Runner otherwise downloads this huge image itself once,
          # with no retry if Google's CDN serves a corrupt ZIP. Preinstall and
          # validate source.properties, retry safely before the AVD startup.
          SYS_IMAGE="$SDK_ROOT/system-images/android-35/google_apis/x86_64"
          image_ok=0
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "system-images;android-35;google_apis;x86_64" && test -f "$SYS_IMAGE/source.properties"; then
              image_ok=1
              break
            fi
            echo "::warning::Android API 35 Google APIs x86_64 system image was unavailable or corrupt (attempt $attempt/3)"
            rm -rf "$SYS_IMAGE"
            sleep $((attempt * 10))
          done
          test "$image_ok" -eq 1
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Empaquetar audio y compilar QA debug (sin firma productiva)
        run: |
          cp musica.mp3 android/app/src/main/assets/musica.mp3
          # Maven Central may throttle concurrent ephemeral GitHub runners
          # with 429 responses before the APK is compiled. Retry the SAME
          # strict Gradle build with capped concurrency; no test is bypassed.
          set -o pipefail
          built=0
          build_log="$(mktemp)"
          for attempt in 1 2 3; do
            if gradle -p android --no-daemon --max-workers=2 assembleDebug 2>&1 | tee "$build_log"; then
              built=1
              break
            fi
            # Stop immediately on Java/Gradle errors that are NOT a transient
            # dependency mirror outage, rather than wasting two more builds.
            if ! grep -Eiq 'Received status code (429|502|503)|Too Many Requests|Read timed out|Connection reset' "$build_log"; then
              echo "::error::Android build failed for a non-transient reason; refusing blind retries"
              break
            fi
            echo "::warning::Maven dependency mirror transient error (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          rm -f "$build_log"
          test "$built" -eq 1
      - name: AVD limpio, sin vincular, métricas y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-build: 15261927
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -memory 1536 -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/visual-evolution-p1-avd.sh

      - name: Capturar diagnóstico de AVD si falla el gate
        if: failure()
        shell: bash
        run: bash scripts/p8-emulator-diagnostics.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-p0-android-unpaired-avd-evidence
          path: |
            qa-artifacts/p8-emulator-health.txt
            build/p0-avd/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 30
