name: Galaxy Chat 4 Phase 0 Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "android/app/src/main/assets/mobile/**"
      - "android/app/src/androidTest/**"
      - "scripts/chat-4-phase0-baseline.mjs"
      - "scripts/benchmark-phase4.mjs"
      - "tests/chat-4-phase0-baseline.test.mjs"
      - "docs/qa/chat-4-phase0-baseline.md"
      - "package.json"
      - ".github/workflows/chat-4-phase0-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Reproducible Node baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Tests
        run: npm test
      - name: Baseline
        run: |
          mkdir -p qa-artifacts
          npm run bench:chat4:phase0 -- qa-artifacts/chat-4-phase0-node.json | tee qa-artifacts/chat-4-phase0-node.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: galaxy-chat-4-phase0-node
          path: qa-artifacts/**
          retention-days: 14
