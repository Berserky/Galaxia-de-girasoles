name: Phase 4 Performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/android-companion/**'
      - 'tests/performance-phase4.test.mjs'
      - 'scripts/benchmark-phase4.mjs'
      - 'scripts/compare-phase4-benchmark.mjs'
      - 'scripts/android-performance-phase4.sh'
      - '.github/workflows/performance-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Phase 4 contract tests
        run: node --test tests/performance-phase4.test.mjs
      - name: Benchmark baseline and branch
        run: |
          git show 72b10c94a683d4cbec506d8e143b3db1bd997310:supabase/functions/android-companion/index.ts > /tmp/phase4-baseline-index.ts
          node scripts/benchmark-phase4.mjs /tmp/phase4-baseline-index.ts > /tmp/phase4-baseline.json
          node scripts/benchmark-phase4.mjs supabase/functions/android-companion/index.ts > /tmp/phase4-after.json
          node scripts/compare-phase4-benchmark.mjs /tmp/phase4-baseline.json /tmp/phase4-after.json /tmp/phase4-benchmark.md
          cat /tmp/phase4-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase4-performance-benchmark
          path: |
            /tmp/phase4-baseline.json
            /tmp/phase4-after.json
            /tmp/phase4-benchmark.md
          retention-days: 14

  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Measure RAM CPU and cold launch on staging emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            git worktree add --detach /tmp/phase4-baseline 72b10c94a683d4cbec506d8e143b3db1bd997310
            cp /tmp/phase4-baseline/musica.mp3 /tmp/phase4-baseline/android/app/src/main/assets/musica.mp3
            gradle -p /tmp/phase4-baseline/android assembleDebug
            cp /tmp/phase4-baseline/android/app/build/outputs/apk/debug/app-debug.apk /tmp/phase4-baseline.apk
            cp musica.mp3 android/app/src/main/assets/musica.mp3
            gradle -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/phase4-after.apk
            bash scripts/android-performance-phase4.sh /tmp/phase4-baseline.apk /tmp/phase4-after.apk /tmp/android-phase4.md
      - name: Publish Android runtime summary
        if: always()
        run: |
          if [ -f /tmp/android-phase4.md ]; then cat /tmp/android-phase4.md >> "$GITHUB_STEP_SUMMARY"; else echo 'Android runtime measurement did not complete.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase4-android-runtime
          path: |
            /tmp/android-phase4.md
            /tmp/phase4-baseline-batterystats.txt
            /tmp/phase4-after-batterystats.txt
          if-no-files-found: warn
          retention-days: 14
