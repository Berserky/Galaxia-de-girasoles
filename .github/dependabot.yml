version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "desarrollo"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "android"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "desarrollo"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
